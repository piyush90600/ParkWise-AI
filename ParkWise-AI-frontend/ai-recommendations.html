<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Recommendations | ParkWise AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

   
    <link rel="stylesheet" href="css/ai-recommendations.css">
    <link rel="stylesheet" href="css/shared.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-square-parking brand-icon"></i>
                <span class="brand-name">ParkWise<span> AI</span></span>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div>
                    <h1>AI Parking Recommendations</h1>
                    <p class="subtitle">Ranked matches based on price, distance, and historical availability</p>
                </div>
                <div class="header-profile">
                    <i class="fa-regular fa-bell icon-btn"></i>
                    <div class="avatar">KM</div>
                </div>
            </header>

            <section class="preference-card">
                <div class="pref-field">
                    <label>Priority Preference</label>
                    <select id="prioritySelect">
                        <option value="balanced">Best Value (Balanced)</option>
                        <option value="price">Lowest Price</option>
                        <option value="distance">Shortest Distance</option>
                        <option value="availability">Highest Availability</option>
                    </select>
                </div>
                <button class="btn-action" id="recalculateBtn">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Recalculate
                </button>
            </section>

            <div class="recommendations-container" id="recommendationsList">
                </div>
        </main>
    </div>

    <script src="js/shared-layout.js"></script>
    <script src="js/ai-recommendations.js"></script>
</body>
</html>
