<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Settings | ParkWise AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/shared.css"><link rel="stylesheet" href="css/utility-pages.css">
</head>
<body><div class="app-layout"><aside class="sidebar"></aside><main class="main-content"><header class="top-header"></header><section class="utility-page"><div class="utility-grid"><div class="utility-card"><h2>Notifications</h2><p>Choose the alerts you want to receive.</p><div class="setting-row"><div><h3>Parking availability alerts</h3><p>Notify me when a saved location has spaces.</p></div><input class="toggle" type="checkbox" checked></div><div class="setting-row"><div><h3>Booking reminders</h3><p>Remind me before a parking session ends.</p></div><input class="toggle" type="checkbox" checked></div><div class="setting-row"><div><h3>AI recommendations</h3><p>Receive smarter parking suggestions.</p></div><input class="toggle" type="checkbox"></div></div><aside class="utility-card"><h2>Preferences</h2><p>Set your default parking choices.</p><div class="field"><label for="radius">Search radius</label><select id="radius"><option>2 km</option><option>5 km</option><option>10 km</option></select></div><div class="field"><label for="preference">Recommendation priority</label><select id="preference"><option>Best value</option><option>Lowest price</option><option>Shortest distance</option></select></div><button class="button-primary" type="button">Save preferences</button></aside></div></section></main></div><script src="js/shared-layout.js"></script></body>
</html>
