<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings | ParkWise AI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/utility-pages.css">
</head>

<body>

    <div class="app-layout">

        <!-- Sidebar -->
        <aside class="sidebar">
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Header -->
            <header class="top-header">
            </header>

            <!-- Settings Page -->
            <section class="utility-page">

                <div class="utility-grid">

                    <!-- Notifications Card -->
                    <div class="utility-card">

                        <h2>Notifications</h2>
                        <p>Choose the alerts you want to receive.</p>

                        <!-- Parking Availability -->
                        <div class="setting-row">
                            <div>
                                <h3>Parking availability alerts</h3>
                                <p>
                                    Notify me when a saved location has spaces.
                                </p>
                            </div>

                            <input
                                class="toggle"
                                type="checkbox"
                                checked
                            >
                        </div>

                        <!-- Booking Reminders -->
                        <div class="setting-row">
                            <div>
                                <h3>Booking reminders</h3>
                                <p>
                                    Remind me before a parking session ends.
                                </p>
                            </div>

                            <input
                                class="toggle"
                                type="checkbox"
                                checked
                            >
                        </div>

                        <!-- AI Recommendations -->
                        <div class="setting-row">
                            <div>
                                <h3>AI recommendations</h3>
                                <p>
                                    Receive smarter parking suggestions.
                                </p>
                            </div>

                            <input
                                class="toggle"
                                type="checkbox"
                            >
                        </div>

                    </div>
                </div>

            </section>

        </main>

    </div>

    <!-- JavaScript -->
    <script src="js/shared-layout.js"></script>

</body>
</html>
